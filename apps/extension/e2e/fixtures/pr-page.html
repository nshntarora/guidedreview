<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add feature · Pull Request #1 · acme/widgets</title>

  <body>
    <!--
      Minimal stand-in for a GitHub PR page: just enough markup for the content
      script to find a mount point (`.gh-header-actions`, one of the selectors
      `findButtonAnchor` in src/content/index.tsx tries) and inject its button.
      Real GitHub markup is far more elaborate; e2e only needs this anchor plus
      the URL shape `/*/*/pull/*` that `parsePRUrl` matches.
    -->
    <div class="gh-header">
      <h1 class="gh-header-title">Add feature</h1>
      <div class="gh-header-actions"></div>
    </div>
  </body>

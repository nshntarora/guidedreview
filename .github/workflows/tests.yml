name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# paths-filter uses the Pulls API on pull_request events; without
# pull-requests:read the job fails with "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      ui: ${{ steps.filter.outputs.ui }}
      web: ${{ steps.filter.outputs.web }}
      cli: ${{ steps.filter.outputs.cli }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            extension:
              - 'apps/extension/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/**'
            ui:
              - 'packages/ui/**'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/**'
            cli:
              - 'apps/cli/**'
              - 'packages/core/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/**'
            root:
              - 'eslint.config.js'
              - '.prettierrc'
              - '.prettierignore'
              - 'lint-staged.config.js'
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    # Write so auto-fixed lint/format can be committed back to the PR branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PR: head branch. Push: branch name. Avoids the PR merge commit so
          # autofix commits land on the contributor branch.
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Apply what tools can fix; continue so unfixable ESLint errors still
      # allow Prettier to run and partial fixes to be committed.
      - name: Apply ESLint autofixes
        continue-on-error: true
        run: pnpm lint:fix

      - name: Apply Prettier
        run: pnpm format

      # Cannot push: fork PR heads, or the protected default branch (required
      # status checks reject GITHUB_TOKEN pushes to main). Fail instead of
      # letting a dirty tree make the later format:check pass.
      - name: Fail when autofixes cannot be pushed
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Lint/format issues are auto-fixable, but CI cannot push a commit to this ref (protected default branch, or a fork PR). Run: pnpm lint:fix && pnpm format"
            git --no-pager diff --stat
            exit 1
          fi

      # Same-repo PRs only. Pushing a bot commit to main is rejected by
      # required status checks (GH013).
      - name: Commit autofixes
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "style: auto-fix lint and format"

      # Hard gates: fail on remaining (non-auto-fixable) issues after any commit.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: changes
    # Path filters apply on both PRs and main — docs-only merges skip unit.
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run unit tests
        run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Separate key from e2e-web: extension and web pin different @playwright/test
      # versions (and browser revisions). Sharing one key races and can restore a
      # cache that is missing chromium_headless_shell for this workspace.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-extension-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Always install browsers (no-op / seconds when the cache already has the
      # revision). Skipping install on cache-hit fails when the cache is partial
      # or was written by another Playwright version.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
        working-directory: apps/extension

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: apps/extension

      - name: Run e2e tests
        run: pnpm --filter @guided-review/extension test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/extension/playwright-report/
            apps/extension/test-results/
          retention-days: 7

  e2e-web:
    name: End-to-end tests (website)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
        working-directory: apps/web

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: apps/web

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          # Avoid huge globs (slow/fail under hashFiles); lockfile + package configs are enough
          # for invalidation, with restore-keys covering partial hits.
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json', 'apps/web/next.config.ts', 'packages/ui/package.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Run website e2e tests
        env:
          # Canonical URLs are asserted by the static-export suite. This public,
          # non-secret value must also be available to pull-request workflows.
          NEXT_PUBLIC_SITE_URL: https://guidedreview.dev
        run: pnpm --filter @guided-review/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  e2e-cli:
    name: End-to-end tests (CLI UI)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-cli-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
        working-directory: apps/cli

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: apps/cli

      - name: Run CLI UI e2e tests
        run: pnpm --filter @guided-review/cli test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cli
          path: |
            apps/cli/playwright-report/
            apps/cli/test-results/
          retention-days: 7

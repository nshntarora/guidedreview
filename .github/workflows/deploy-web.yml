# Deploy the marketing site (apps/web) to Cloudflare Pages.
#
# Static Next export (`apps/web/out`) is uploaded with `wrangler pages deploy`.
# Production (main / workflow_dispatch) deploys to the production branch;
# PRs deploy as preview deployments on the PR branch.
#
# Required GitHub secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Account API token with Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID
#
# Pages project name: guidedreview (change --project-name below if yours differs).
#
# Action docs: https://github.com/cloudflare/wrangler-action

name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # Fork PRs do not receive repo secrets; skip rather than fail the build matrix.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build marketing site
        run: npm run build -w @guided-review/web

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          # Monorepo uses root package-lock.json; pin npm so the action does not
          # guess wrong from apps/web alone. Installed wrangler (npm ci) is reused.
          packageManager: npm
          # Production branch → production deploy. Other branches → preview.
          # See: "Deploy your Pages site" in wrangler-action README.
          command: pages deploy out --project-name=guidedreview --branch=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          # Optional: create GitHub Deployments from the action.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

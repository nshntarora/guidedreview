name: Lint and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# paths-filter uses the Pulls API on pull_request events; without
# pull-requests:read the job fails with "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lint-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      ui: ${{ steps.filter.outputs.ui }}
      web: ${{ steps.filter.outputs.web }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            extension:
              - 'apps/extension/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/**'
            ui:
              - 'packages/ui/**'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/**'
            root:
              - 'eslint.config.js'
              - '.prettierrc'
              - '.prettierignore'
              - 'lint-staged.config.js'
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    # Write so auto-fixed lint/format can be committed back to the PR branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PR: head branch. Push: branch name. Avoids the PR merge commit so
          # autofix commits land on the contributor branch.
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Apply what tools can fix; continue so unfixable ESLint errors still
      # allow Prettier to run and partial fixes to be committed.
      - name: Apply ESLint autofixes
        continue-on-error: true
        run: npm run lint:fix

      - name: Apply Prettier
        run: npm run format

      # GITHUB_TOKEN cannot push to fork heads; fail clearly if a commit is needed.
      - name: Fail fork PRs that need autofix commit
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Lint/format issues are auto-fixable, but this is a fork PR so CI cannot push. Run: npm run lint:fix && npm run format"
            exit 1
          fi

      - name: Commit autofixes
        if: >
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-fix lint and format"

      # Hard gates: fail on remaining (non-auto-fixable) issues after any commit.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: changes
    # Path filters apply on both PRs and main — docs-only merges skip unit.
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Separate key from e2e-web: extension and web pin different @playwright/test
      # versions (and browser revisions). Sharing one key races and can restore a
      # cache that is missing chromium_headless_shell for this workspace.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-extension-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Always install browsers (no-op / seconds when the cache already has the
      # revision). Skipping install on cache-hit fails when the cache is partial
      # or was written by another Playwright version.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: apps/extension

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/extension

      - name: Run e2e tests
        run: npm run test:e2e -w @guided-review/extension

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/extension/playwright-report/
            apps/extension/test-results/
          retention-days: 7

  e2e-web:
    name: End-to-end tests (website)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: apps/web

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          # Avoid huge globs (slow/fail under hashFiles); lockfile + package configs are enough
          # for invalidation, with restore-keys covering partial hits.
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/package.json', 'apps/web/next.config.ts', 'packages/ui/package.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Run website e2e tests
        run: npm run test:e2e -w @guided-review/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

# Deploy the marketing site (apps/web) to Cloudflare Pages.
#
# Runs only after the "Lint and test" workflow succeeds on a push to main
# (or via workflow_dispatch). Static Next export (`apps/web/out`) is uploaded
# with `wrangler pages deploy` to the production branch.
#
# Required GitHub secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Account API token with Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID
#
# Pages project name: guidedreview (change --project-name below if yours differs).
#
# Action docs: https://github.com/cloudflare/wrangler-action

name: Deploy

on:
  workflow_run:
    workflows: [Lint and test]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Only proceed when Lint and test succeeded on a push to main
    # (or this was a manual run). workflow_run also fires for PRs whose head
    # is main in edge cases; require event == push to stay production-only.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # paths-filter cannot fetch relative refs like HEAD~1 (invalid refspec).
      # Resolve push base to a real parent SHA after checkout.
      - name: Resolve change-detection base
        if: github.event_name == 'workflow_run'
        id: paths_base
        run: |
          # Tip vs parent so merge/squash deploys still see the right paths.
          echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          base: ${{ steps.paths_base.outputs.base }}
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/**'

  deploy:
    name: Deploy marketing site
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/package.json', 'apps/web/next.config.ts', 'packages/ui/package.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Build marketing site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Analytics is off unless ENABLED is exactly "true" and a key is set.
          # Add repo secrets/vars: NEXT_PUBLIC_ANALYTICS_KEY (and optionally the rest).
          # Production events go through the existing Worker at guidedreview.dev/i/*.
          NEXT_PUBLIC_ANALYTICS_ENABLED: ${{ secrets.NEXT_PUBLIC_ANALYTICS_ENABLED }}
          NEXT_PUBLIC_ANALYTICS_KEY: ${{ secrets.NEXT_PUBLIC_ANALYTICS_KEY }}
          NEXT_PUBLIC_ANALYTICS_PROXY_PATH: ${{ secrets.NEXT_PUBLIC_ANALYTICS_PROXY_PATH }}
        run: npm run build -w @guided-review/web

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          # Monorepo uses root package-lock.json; pin npm so the action does not
          # guess wrong from apps/web alone. Installed wrangler (npm ci) is reused.
          packageManager: npm
          # Production branch → production deploy.
          # See: "Deploy your Pages site" in wrangler-action README.
          command: pages deploy out --project-name=guidedreview --branch=main
          # Optional: create GitHub Deployments from the action.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
